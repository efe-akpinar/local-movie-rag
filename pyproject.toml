[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-rag"
version = "0.1.0"
description = "Grounded movie Q&A service: bge-small + FAISS retrieval, cross-encoder re-ranking, pluggable LLM"
requires-python = ">=3.11"
# torch is a dependency of sentence-transformers; install the CPU wheel first for small images:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<2.3",
    "faiss-cpu>=1.9,<2",
    "sentence-transformers>=3.0,<6",
    "transformers>=4.45,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "uvicorn-worker>=0.2,<1",
    "gunicorn>=22,<24",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "prometheus-client>=0.20,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
local = ["accelerate", "bitsandbytes"]  # LLM_PROVIDER=local on a CUDA GPU
gcs = ["google-cloud-storage>=2.16"]  # scripts/build_index.py --gcs-bucket
loadtest = ["locust>=2.29"]

[tool.setuptools]
packages = ["movie_rag"]

[tool.setuptools.package-data]
movie_rag = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["movie_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
