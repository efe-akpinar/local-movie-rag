apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: movie-rag
  labels:
    app: movie-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: movie-rag
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
