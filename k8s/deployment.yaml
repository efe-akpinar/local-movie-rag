apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-rag
  labels:
    app: movie-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-rag
  template:
    metadata:
      labels:
        app: movie-rag
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          # CI loads movie-rag:ci into kind; for a real cluster, use the Artifact Registry image.
          image: movie-rag:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: movie-rag-config
            - secretRef:
                name: movie-rag-secrets
                optional: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          # Models and index load at startup; allow up to ~3 minutes before liveness checks start.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
